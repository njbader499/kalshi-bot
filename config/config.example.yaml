# Kalshi maker bot configuration. Copy to config/config.yaml.
# Secrets do NOT go here; they go in .env (see .env.example).
# Every value is validated at load. The bot refuses to start if anything is absurd.

# Hosts are configurable because Kalshi has moved them before.
# Source: docs.kalshi.com/getting_started/api_environments (read directly 2026-11-04).
# Kalshi also offers warp-ws hosts that serve ONLY the fill/user_orders channels; not used yet.
hosts:
  demo:
    rest: "https://external-api.demo.kalshi.co/trade-api/v2"
    ws: "wss://external-api-ws.demo.kalshi.co/trade-api/ws/v2"
  prod:
    rest: "https://external-api.kalshi.com/trade-api/v2"
    ws: "wss://external-api-ws.kalshi.com/trade-api/ws/v2"

# Risk limits for a $500 bankroll (Section 7). Dollars, as strings, parsed with Decimal.
risk:
  bankroll: "500"
  max_capital_deployed: "300"
  max_cost_per_market: "50"
  max_cost_per_event: "75"
  max_cost_per_category: "150"
  max_order_cost: "15"
  max_resting_orders: 40
  max_markets_quoted: 3          # 3 while in demo; spec default for later is 10
  daily_loss_stop: "25"
  weekly_loss_stop: "60"
  max_drawdown: "100"
  max_orders_per_minute: 30
  max_consecutive_api_errors: 5
  api_error_pause_seconds: 300
  stale_data_seconds: 30
  allow_taker_flatten: false

# Rate limiter. Verified against docs.kalshi.com/getting_started/rate_limits (2026-11-04).
# Basic tier: read 200 tokens/s, bucket holds 3 s; write 100 tokens/s, bucket holds 1 s.
# Default cost 10 tokens. Balance has its own bucket (1 call/s, no burst).
# 429 responses carry no Retry-After header, so the client backs off exponentially.
# Non-default costs are fetched from GET /account/endpoint_costs at startup; the list
# below is the offline fallback (copied from that endpoint on 2026-11-04).
# Batch endpoints bill per item, so they save requests, not tokens.
rate_limits:
  read_tokens_per_sec: 200
  write_tokens_per_sec: 100
  default_cost: 10
  read_burst_seconds: 3
  write_burst_seconds: 1
  balance_calls_per_sec: 1
  refresh_costs_from_api: true
  endpoint_costs:
    "DELETE /portfolio/events/orders": 2
    "DELETE /portfolio/events/orders/:order_id": 2
    "DELETE /portfolio/events/orders/batched": 2
    "GET /portfolio/orders/:order_id": 2
    "POST /account/api_usage_level/upgrade": 30
  max_retries: 5
  backoff_base_seconds: 0.5
  backoff_max_seconds: 30

# Fees. fee = ceil_to_cent(rate * contracts * P * (1 - P)).
# Maker rate defaults to 0. Any series with a nonzero maker rate is excluded unless listed here.
fees:
  taker_rate: "0.07"
  default_maker_rate: "0"
  allowed_maker_fee_series: []

# Exclusions (Section 6).
exclusions:
  banned_categories: ["Sports", "Politics", "Elections", "Entertainment", "Mentions", "Media"]
  banned_ticker_patterns: ["^KXMV", "MULTIGAME", "PARLAY"]
  min_time_to_close_minutes: 60

# Laptop safety. Every resting order carries an exchange-side expiration so quotes die on
# their own if the bot, laptop or Wi-Fi does. While the bot is alive it pushes the expiry
# forward with an expiry-only amend, which keeps queue position.
# A sleep/wake, a network drop, or a wall-clock jump larger than clock_jump_seconds makes the
# bot stop quoting, cancel all of its own orders once it's reconnected, re-snapshot books
# and reconcile with the exchange before it resumes.
safety:
  order_expiry_seconds: 600
  expiry_refresh_seconds: 240
  clock_jump_seconds: 30
  loop_stall_seconds: 15
  clock_drift_warn_seconds: 1
  prevent_sleep: true          # Windows SetThreadExecutionState while the bot runs
  cancel_order_on_pause: true  # exchange cancels our orders if trading is paused

# Markets to watch (Phase 2: books + ledger only; quoting starts in Phase 4).
# Confirmed by the owner 2026-11-04: the three most liquid daily-high series on prod.
markets:
  weather_series: ["KXHIGHNY", "KXHIGHMIA", "KXHIGHCHI"]
  rediscover_minutes: 30     # weather markets roll daily; pick up new ones
  status_log_seconds: 60

# Weather fair-value engine (Phase 3, shadow mode: computes and logs, never trades).
# Settlement: The Weather Company, proxied by the NWS Daily Climate Report (owner-approved
# 2026-11-04); integer °F; NWS climate day in local standard time.
weather:
  dst_rule_rechecked: false    # MUST be re-verified before 2027-03-14 (US DST); see DECISIONS.md
  # Model v2 (2026-11-05): X = max(observed so far, forecast of the remaining hours). These
  # globals are PRIORS; run scripts/calibrate_weather.py and paste its `stations:` block
  # below to override them per city. bias_f = +1.0 because the hourly-sampled ensemble
  # daily max ran 2-3F cold in 6 of 8 cities on 2026-11-04 (DECISIONS.md "Model v2").
  sigma_f: 1.5                 # extra spread around each ensemble member's remaining extreme
  nws_weight: 0.5              # weight of the NWS forecast (hourly max, lifted by the daily high)
  nws_sigma_f: 2.0
  bias_f: 1.0                  # added to ENSEMBLE MEMBERS only (F); provisional prior
  nws_bias_f: 0.0              # the NWS forecast is forecaster-adjusted: leave at 0
  min_confidence: 0.6          # below this, no quote
  fair_interval_minutes: 10
  settlement_check_minutes: 60
  # P(official daily extreme - hourly-METAR extreme = d). The station's daily summary uses
  # finer data than the hourly obs, so the official value is usually the hourly max or a
  # degree above it. Re-fit from the shadow log by the calibration script.
  obs_offset_probs: {"-1": 0.05, "0": 0.45, "1": 0.40, "2": 0.10}
  # Local-standard-time daytime ramp: same-day confidence is halved inside it unless an
  # official intraday CLI value exists (hourly obs lag a rising temperature).
  ramp_start_hour: 10
  ramp_end_hour: 16
  # Per-station fits from the calibrator, e.g.
  #   CLIMIA: {bias_f: 2.0, bias_gfs_f: 1.2, bias_ecmwf_f: 2.5, sigma_f: 1.0}
  # bias_gfs_f / bias_ecmwf_f apply to that model's members; bias_f is the fallback.
  stations: {}

# Quoting fair value = blend of the MODEL and the REAL market (prod public book; on prod the
# live book). A market where the model disagrees with the market by more than
# max_disagreement is NOT quoted (and listed under "not quoted" in /status): on 2026-11-04 an
# untuned model priced the favourite brackets at 0.11-0.22 against a market at 0.5-0.76 and
# the bot went short every one of them.
blend:
  weight: "0.6"                # share of the market mid in the quoted fair
  max_spread: "0.10"           # prod book wider than this is not a usable reference
  max_disagreement: "0.15"
  model_only_ok: false         # never quote on the model alone without a usable reference
  max_ref_age_seconds: 1500

# Order placement (Phase 4). TRADING IS OFF. The owner flips trading_enabled after reviewing
# the calibration report. While false, the order manager runs dry: it records what it WOULD
# do in the ledger (shadow_orders) and never sends anything to Kalshi.
trading:
  trading_enabled: false
  tilt_enabled: true
  order_count: "1"               # contracts per quote (tiny while on demo)
  edge_full_size: "0.12"        # size scales with edge: 1 contract at the 2c buffer, up to max_order_cost at 12c edge
  count_hysteresis_pct: 25       # only resize a resting quote on a >= 25% change
  loop_seconds: 15
  max_fair_age_seconds: 1500     # don't quote on a fair value older than this
  min_seconds_between_amends: 20

# Mode A tilt (Section 3): rest bids only on the side the bias favors.
# Mode S, `symmetric` (Section 3 / strategy/symmetric.py): a YES bid and a NO bid around the
# blended fair, inside the book, never crossing. This is the maker edge the research found
# (resting orders earn the spread and fade takers); it does not bet against the market.
symmetric:
  enabled: true
  half_spread: "0.02"          # each quote sits this far from fair (min; widened by the book)
  min_market_spread_ticks: 3   # only quote when the book's own spread leaves room
  max_inventory: "30"          # contracts; past this only the reducing side is quoted
  skew_per_contract: "0.001"   # shift both quotes away from the held side, per contract
  min_price: "0.05"            # no quotes below 5c or above 95c
  count: "1"                   # contracts per quote (edge-scaled up to risk.max_order_cost)

# Mode A, `tilt`: one-sided bids where the blended fair is extreme (favourite YES / longshot
# NO). Used in markets where symmetric has no room. Switch with trading.tilt_enabled.
tilt:
  edge_buffer: "0.02"
  favorite_threshold: "0.70"     # bid YES when fair >= 0.70
  longshot_threshold: "0.30"     # bid NO when fair <= 0.30
  min_yes_price: "0.10"          # never buy YES below 10c
  min_no_price: "0.10"           # never buy NO below 10c
  hysteresis_ticks: 1            # don't move a quote for less than this many ticks

# Alerts (Telegram arrives in Phase 5). Fills are batched; risk/kill/error alerts are instant.
alerts:
  fill_batch_minutes: 15
  instant_kinds: ["risk", "kill", "error"]
  daily_summary_time: "08:00"   # daily P&L summary (local time below)
  daily_summary_tz: "Europe/Prague"

paths:
  data_dir: "./data"
  log_dir: "./logs"
  kill_file: "./KILL"

logging:
  level: "INFO"
  max_bytes: 10485760
  backup_count: 10
