# Kalshi maker bot configuration. Copy to config/config.yaml.
# Secrets do NOT go here; they go in .env (see .env.example).
# Every value is validated at load. The bot refuses to start if anything is absurd.

# Hosts are configurable because Kalshi has moved them before.
# Source: docs.kalshi.com/getting_started/api_environments (read directly 2026-11-04).
# Kalshi also offers warp-ws hosts that serve ONLY the fill/user_orders channels; not used yet.
hosts:
  demo:
    rest: "https://external-api.demo.kalshi.co/trade-api/v2"
    ws: "wss://external-api-ws.demo.kalshi.co/trade-api/ws/v2"
  prod:
    rest: "https://external-api.kalshi.com/trade-api/v2"
    ws: "wss://external-api-ws.kalshi.com/trade-api/ws/v2"

# Risk limits for a $500 bankroll (Section 7). Dollars, as strings, parsed with Decimal.
risk:
  bankroll: "500"
  max_capital_deployed: "300"
  max_cost_per_market: "50"
  max_cost_per_event: "75"
  max_cost_per_category: "150"
  max_order_cost: "15"
  max_resting_orders: 40
  max_markets_quoted: 3          # 3 while in demo; spec default for later is 10
  daily_loss_stop: "25"
  weekly_loss_stop: "60"
  max_drawdown: "100"
  max_orders_per_minute: 30
  max_consecutive_api_errors: 5
  api_error_pause_seconds: 300
  stale_data_seconds: 30
  allow_taker_flatten: false

# Rate limiter. Verified against docs.kalshi.com/getting_started/rate_limits (2026-11-04).
# Basic tier: read 200 tokens/s, bucket holds 3 s; write 100 tokens/s, bucket holds 1 s.
# Default cost 10 tokens. Balance has its own bucket (1 call/s, no burst).
# 429 responses carry no Retry-After header, so the client backs off exponentially.
# Non-default costs are fetched from GET /account/endpoint_costs at startup; the list
# below is the offline fallback (copied from that endpoint on 2026-11-04).
# Batch endpoints bill per item, so they save requests, not tokens.
rate_limits:
  read_tokens_per_sec: 200
  write_tokens_per_sec: 100
  default_cost: 10
  read_burst_seconds: 3
  write_burst_seconds: 1
  balance_calls_per_sec: 1
  refresh_costs_from_api: true
  endpoint_costs:
    "DELETE /portfolio/events/orders": 2
    "DELETE /portfolio/events/orders/:order_id": 2
    "DELETE /portfolio/events/orders/batched": 2
    "GET /portfolio/orders/:order_id": 2
    "POST /account/api_usage_level/upgrade": 30
  max_retries: 5
  backoff_base_seconds: 0.5
  backoff_max_seconds: 30

# Fees. fee = ceil_to_cent(rate * contracts * P * (1 - P)).
# Maker rate defaults to 0. Any series with a nonzero maker rate is excluded unless listed here.
fees:
  taker_rate: "0.07"
  default_maker_rate: "0"
  allowed_maker_fee_series: []

# Exclusions (Section 6).
exclusions:
  banned_categories: ["Sports", "Politics", "Elections", "Entertainment", "Mentions", "Media"]
  banned_ticker_patterns: ["^KXMV", "MULTIGAME", "PARLAY"]
  min_time_to_close_minutes: 60

# Laptop safety. Every resting order carries an exchange-side expiration so quotes die on
# their own if the bot, laptop or Wi-Fi does. While the bot is alive it pushes the expiry
# forward with an expiry-only amend, which keeps queue position.
# A sleep/wake, a network drop, or a wall-clock jump larger than clock_jump_seconds makes the
# bot stop quoting, cancel all of its own orders once it's reconnected, re-snapshot books
# and reconcile with the exchange before it resumes.
safety:
  order_expiry_seconds: 600
  expiry_refresh_seconds: 240
  clock_jump_seconds: 30
  loop_stall_seconds: 15
  clock_drift_warn_seconds: 1
  prevent_sleep: true          # Windows SetThreadExecutionState while the bot runs
  cancel_order_on_pause: true  # exchange cancels our orders if trading is paused

# Markets to watch (Phase 2: books + ledger only; quoting starts in Phase 4).
# Confirmed by the owner 2026-11-04: the three most liquid daily-high series on prod.
markets:
  weather_series: ["KXHIGHNY", "KXHIGHMIA", "KXHIGHCHI"]
  rediscover_minutes: 30     # weather markets roll daily; pick up new ones
  status_log_seconds: 60

# Alerts (Telegram arrives in Phase 5). Fills are batched; risk/kill/error alerts are instant.
alerts:
  fill_batch_minutes: 15
  instant_kinds: ["risk", "kill", "error"]

paths:
  data_dir: "./data"
  log_dir: "./logs"
  kill_file: "./KILL"

logging:
  level: "INFO"
  max_bytes: 10485760
  backup_count: 10
